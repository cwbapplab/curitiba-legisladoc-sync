[package]
name = "legisladoc-sync"
version = "0.1.0"
description = "Browse and search the Legisladoc rsync feed with a local index"
authors = ["Erick"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "legisladoc_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source: no system sqlite3.dll to chase on Windows.
# FTS5 lives in the main SQLite amalgamation and is enabled by default in this build.
rusqlite = { version = "0.40", features = ["bundled"] }
# HTTP with byte-range support. The feed's Apache mirror advertises
# `Accept-Ranges: bytes`, which is what makes byte-offset delta sync possible.
ureq = "3"
# Runtime schema comes from the feed's own `*_Info.xml`.
roxmltree = "0.21"
encoding_rs = "0.8"
# Vendored: upstream 0.2.1 panics on Windows for *every* url (see vendor/arrsync/src/client.rs),
# so we carry the one-line fix rather than patching a registry copy.
arrsync = { path = "vendor/arrsync" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
# SMTP for the notification emails. `default-features = false` is mandatory: the
# defaults pull `native-tls` (OpenSSL/SChannel), which this app has no system copy
# of. `rustls-tls` reuses the rustls + ring + webpki-roots already compiled in via
# ureq, so no second TLS stack is introduced.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "hostname",
    "rustls-tls",
] }
# AES-256-GCM for the stored SMTP password. Pinned to 0.10: its `aead` 0.5 API
# (`generate_key`/`generate_nonce` over `OsRng`) is stable, and its default
# `getrandom` feature supplies the key/nonce generation, so no RNG crate is needed.
aes-gcm = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
